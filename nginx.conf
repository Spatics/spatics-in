server {
    listen 3000 default_server;
    listen [::]:3000 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Security Headers.
    # nginx inherits add_header from an outer level ONLY when the current level
    # declares none of its own. Both location blocks below set Cache-Control, so
    # these four must be repeated there or they are dropped for every response
    # that matters, index.html included. Change one, change all three.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Coolify & Container Health Check Endpoints
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'OK';
    }

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy","service":"spatics-coming-soon"}';
    }

    # Static Assets Caching (images, stylesheets and scripts)
    location ~ ^/(assets|css|js)/ {
        add_header Cache-Control "public, max-age=2592000, no-transform" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Main Route & Fallback
    location / {
        try_files $uri $uri/ /index.html =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Error Pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}
